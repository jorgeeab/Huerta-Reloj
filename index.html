<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Control de Plantas, Regímenes y Tareas</title>
  <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
  <style>
    body {
      display: flex;
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 0;
    }
    #panel-izq, #panel-der {
      flex: 1;
      padding: 20px;
      border: 1px solid #ccc;
      overflow-y: auto;
    }
    #map-container {
      width: 100%;
      height: 500px;
      margin-bottom: 20px;
    }
    h2 {
      margin-top: 0;
    }
    label {
      display: block;
      margin-bottom: 5px;
    }
    input, select, button {
      margin-bottom: 10px;
      padding: 5px;
    }
    .section {
      margin-bottom: 20px;
    }
    li, .regimen-item {
      cursor: pointer;
      margin: 5px 0;
    }
    .selected {
      color: red;
      font-weight: bold;
    }
    .hidden {
      display: none;
    }
    /* Para alinear elementos en la misma línea */
    .inline-row {
      display: flex;
      align-items: center;
      margin-bottom: 10px;
      gap: 8px;
    }
    .inline-row label {
      width: 80px;
    }
    .inline-row input[type="number"] {
      width: 100px;
    }
    .arduino-value {
      margin-left: auto;
      font-weight: bold;
      color: #003366;
    }
  </style>
</head>
<body>
<div id="panel-izq">
  <h2>Mapa de Plantas</h2>
  <div id="map-container"></div>

  <!-- Formulario de Planta -->
  <div class="section">
    <h3>Planta</h3>
    <label>ID (edit):</label>
    <input type="number" id="plantId" placeholder="(vacío si nueva)" style="width:100%">

    <label>Nombre:</label>
    <input type="text" id="plantName" style="width:100%">

    <label>Fecha de Inicio:</label>
    <input type="date" id="plantStartDate" style="width:100%">

    <label>Latitud:</label>
    <input type="number" id="plantLat" step="0.0001" style="width:100%">
    <label>Longitud:</label>
    <input type="number" id="plantLon" step="0.0001" style="width:100%">
    <button onclick="setFromRobotPosition()">Usar posición del robot</button>

    <label>Servo1:</label>
    <input type="number" id="plantServo1" value="90" style="width:100%">
    <label>Servo2:</label>
    <input type="number" id="plantServo2" value="90" style="width:100%">
    <label>Flow Rate:</label>
    <input type="number" id="plantFlowRate" step="0.1" value="0.0" style="width:100%">

    <!-- Asignar regimen a la planta -->
    <label>Régimen (asignar a planta):</label>
    <select id="plantRegimenSelect" style="width:100%"></select>

    <button onclick="savePlant()">Guardar Planta</button>
  </div>

  <div class="section">
    <h3>Lista de Plantas</h3>
    <ul id="plantList"></ul>
  </div>
</div>

<div id="panel-der">
  <h2>Control Arduino</h2>

  <!-- Controles + valor leído del Arduino -->
  <div class="section">
    <h3>Valores (con lectura en vivo)</h3>

    <!-- servo1 -->
    <div class="inline-row">
      <label for="arduinoServo1">Servo1:</label>
      <input type="number" id="arduinoServo1" step="1" min="0" max="180" value="90">
      <button onclick="sendArduinoField('servo1')">Enviar</button>
      <span class="arduino-value" id="arduinoServo1Val">--</span>
    </div>

    <!-- servo2 -->
    <div class="inline-row">
      <label for="arduinoServo2">Servo2:</label>
      <input type="number" id="arduinoServo2" step="1" min="0" max="180" value="90">
      <button onclick="sendArduinoField('servo2')">Enviar</button>
      <span class="arduino-value" id="arduinoServo2Val">--</span>
    </div>

    <!-- flowRate -->
    <div class="inline-row">
      <label for="arduinoFlowRate">Flow:</label>
      <input type="number" id="arduinoFlowRate" step="0.1" value="0.0">
      <button onclick="sendArduinoField('flowRate')">Enviar</button>
      <span class="arduino-value" id="arduinoFlowVal">--</span>
    </div>

    <!-- kp -->
    <div class="inline-row">
      <label for="arduinoKp">Kp:</label>
      <input type="number" id="arduinoKp" step="0.1" value="2.0">
      <button onclick="sendArduinoField('kp')">Enviar</button>
      <span class="arduino-value" id="arduinoKpVal">--</span>
    </div>

    <!-- ki -->
    <div class="inline-row">
      <label for="arduinoKi">Ki:</label>
      <input type="number" id="arduinoKi" step="0.1" value="5.0">
      <button onclick="sendArduinoField('ki')">Enviar</button>
      <span class="arduino-value" id="arduinoKiVal">--</span>
    </div>

    <!-- kd -->
    <div class="inline-row">
      <label for="arduinoKd">Kd:</label>
      <input type="number" id="arduinoKd" step="0.1" value="1.0">
      <button onclick="sendArduinoField('kd')">Enviar</button>
      <span class="arduino-value" id="arduinoKdVal">--</span>
    </div>

    <!-- calibración -->
    <div class="inline-row">
      <label for="arduinoCal">Cal:</label>
      <input type="number" id="arduinoCal" step="0.01" value="1.0">
      <button onclick="sendArduinoField('cal')">Enviar</button>
      <span class="arduino-value" id="arduinoCalVal">--</span>
    </div>
  </div>

  <div class="section">
    <h3>Regímenes</h3>
    <label>ID (edit):</label>
    <input type="number" id="regimenId" placeholder="(vacío si nuevo)" style="width:100%">
    <label>Nombre Régimen:</label>
    <input type="text" id="regimenName" style="width:100%">
    <button onclick="saveRegimen()">Guardar Régimen</button>

    <!-- Botón para eliminar el régimen seleccionado -->
    <button id="deleteRegimenBtn" class="hidden" onclick="deleteSelectedRegimen()">Eliminar Régimen Seleccionado</button>

    <h4>Lista de Regímenes (clic para seleccionar)</h4>
    <div id="regimenList"></div>
  </div>

  <!-- TAREAS -->
  <div class="section">
    <h3>Tareas (Regimen seleccionado)</h3>
    <label>ID Régimen Seleccionado:</label>
    <input type="number" id="selectedRegimenId" readonly style="width:100%">

    <!-- Formulario de Tarea -->
    <label>ID Tarea (edit):</label>
    <input type="number" id="taskId" placeholder="(vacío si nuevo)" style="width:100%">
    <label>Tipo de Tarea:</label>
    <input type="text" id="taskType" value="riego" style="width:100%">
    <label>Descripción:</label>
    <input type="text" id="taskDescription" style="width:100%">
    <label>Magnitud:</label>
    <input type="number" id="taskMagnitude" step="0.1" style="width:100%">
    <label>Estado:</label>
    <input type="text" id="taskStatus" value="pendiente" style="width:100%">
    <!-- days en lugar de date -->
    <label>Días (desde inicio planta):</label>
    <input type="number" id="taskDays" value="0" style="width:100%">
    <label>Hora (time):</label>
    <input type="time" id="taskTime" value="00:00" style="width:100%">

    <button onclick="saveTask()">Guardar Tarea</button>

    <h4>Lista de Tareas</h4>
    <div id="taskList"></div>
  </div>
</div>

<script>
const API_BASE = window.location.origin;

window.onload = () => {
  loadMap();
  fetchPlants();
  fetchRegimens();
  // Consultar estado Arduino y refrescar cada 2s
  fetchArduinoState();
  setInterval(fetchArduinoState, 2000);
};

// ------------------------------------------------------------------
// MAPA
// ------------------------------------------------------------------
function loadMap() {
  $('#map-container').load('/map' + window.location.search);
}

// Llamada por el botón “Seleccionar” en el popup del mapa
function selectPlantFromMap(plantId) {
  window.location.href = `/?plant_id=${plantId}`;
}

// ------------------------------------------------------------------
// PLANTAS
// ------------------------------------------------------------------
function fetchPlants() {
  fetch(`${API_BASE}/plants`)
    .then(res => res.json())
    .then(data => {
      renderPlants(data);
      renderRegimenOptions();
    })
    .catch(err => console.error(err));
}

function renderPlants(plants) {
  const urlParams = new URLSearchParams(window.location.search);
  const plantIdInUrl = urlParams.get('plant_id');
  const plantList = document.getElementById("plantList");
  plantList.innerHTML = "";

  plants.forEach(plant => {
    const li = document.createElement("li");
    li.textContent = `#${plant.id}: ${plant.name} (Regimen: ${plant.regimen_id || "Ninguno"})`;
    if (plantIdInUrl && parseInt(plantIdInUrl, 10) === plant.id) {
      li.classList.add("selected");
      loadPlantForm(plant);
      if (plant.regimen_id) {
        // Esperamos un pequeño delay para que ya se haya cargado la lista de regimenes
        setTimeout(() => {
          selectRegimenInList(plant.regimen_id);
        }, 300);
      }
    }
    li.onclick = () => {
      window.location.href = `/?plant_id=${plant.id}`;
    };
    plantList.appendChild(li);
  });
}

function loadPlantForm(plant) {
  document.getElementById("plantId").value = plant.id;
  document.getElementById("plantName").value = plant.name;
  document.getElementById("plantLat").value = plant.lat;
  document.getElementById("plantLon").value = plant.lon;
  document.getElementById("plantServo1").value = plant.servo1;
  document.getElementById("plantServo2").value = plant.servo2;
  document.getElementById("plantFlowRate").value = plant.flowRate;
  document.getElementById("plantStartDate").value = plant.start_date ? plant.start_date.substring(0,10) : "";
  const selReg = document.getElementById("plantRegimenSelect");
  selReg.value = plant.regimen_id || "";
}

function setFromRobotPosition() {
  document.getElementById("plantLat").value = 2.3456;
  document.getElementById("plantLon").value = -100.7890;
  alert("Posición del robot simulada asignada.");
}

function savePlant() {
  const id = document.getElementById("plantId").value || null;
  const name = document.getElementById("plantName").value;
  const lat = parseFloat(document.getElementById("plantLat").value) || 0;
  const lon = parseFloat(document.getElementById("plantLon").value) || 0;
  const servo1 = parseInt(document.getElementById("plantServo1").value, 10) || 90;
  const servo2 = parseInt(document.getElementById("plantServo2").value, 10) || 90;
  const flowRate = parseFloat(document.getElementById("plantFlowRate").value) || 0;
  const start_date = document.getElementById("plantStartDate").value;
  const regimen_id = parseInt(document.getElementById("plantRegimenSelect").value, 10) || null;

  const payload = {
    id, name, lat, lon, servo1, servo2, flowRate, start_date, regimen_id
  };

  fetch(`${API_BASE}/plants`, {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify(payload)
  })
  .then(() => {
    fetchPlants();
    loadMap();
  })
  .catch(err => console.error(err));
}

// ------------------------------------------------------------------
// REGÍMENES
// ------------------------------------------------------------------
function fetchRegimens() {
  fetch(`${API_BASE}/regimens`)
    .then(res => res.json())
    .then(data => renderRegimens(data))
    .catch(err => console.error(err));
}

function renderRegimens(regimens) {
  const regimenList = document.getElementById("regimenList");
  regimenList.innerHTML = "";

  regimens.forEach(r => {
    const div = document.createElement("div");
    div.className = "regimen-item";
    div.textContent = `#${r.id}: ${r.name}`;
    div.onclick = () => selectRegimen(r.id, r.name);
    regimenList.appendChild(div);
  });
}

function renderRegimenOptions() {
  fetch(`${API_BASE}/regimens`)
    .then(res => res.json())
    .then(allRegimens => {
      const sel = document.getElementById("plantRegimenSelect");
      sel.innerHTML = '<option value="">(Ninguno)</option>';
      allRegimens.forEach(r => {
        const opt = document.createElement("option");
        opt.value = r.id;
        opt.text = r.name;
        sel.appendChild(opt);
      });
    })
    .catch(err => console.error(err));
}

function saveRegimen() {
  const id = document.getElementById("regimenId").value || null;
  const name = document.getElementById("regimenName").value;
  if (!name) {
    alert("Debes ingresar un nombre para el régimen.");
    return;
  }

  if (id) {
    // Update
    fetch(`${API_BASE}/regimens/${id}`, {
      method: "PUT",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ name })
    })
    .then(() => {
      resetRegimenForm();
      fetchRegimens();
      renderRegimenOptions();
    })
    .catch(err => console.error(err));
  } else {
    // Create
    fetch(`${API_BASE}/regimens`, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ name })
    })
    .then(() => {
      resetRegimenForm();
      fetchRegimens();
      renderRegimenOptions();
    })
    .catch(err => console.error(err));
  }
}

function resetRegimenForm() {
  document.getElementById("regimenId").value = "";
  document.getElementById("regimenName").value = "";
  document.getElementById("deleteRegimenBtn").classList.add("hidden");
}

function selectRegimen(regimenId, regimenName) {
  document.getElementById("regimenId").value = regimenId;
  document.getElementById("regimenName").value = regimenName;
  document.getElementById("deleteRegimenBtn").classList.remove("hidden");
  document.getElementById("selectedRegimenId").value = regimenId;
  fetchTasks();
}

function selectRegimenInList(regimenId) {
  fetch(`${API_BASE}/regimens/${regimenId}`)
    .then(res => {
      if (res.ok) return res.json();
      throw new Error("Regimen no encontrado");
    })
    .then(regimen => {
      document.getElementById("regimenId").value = regimen.id;
      document.getElementById("regimenName").value = regimen.name;
      document.getElementById("deleteRegimenBtn").classList.remove("hidden");
      document.getElementById("selectedRegimenId").value = regimen.id;
      fetchTasks();
    })
    .catch(err => console.error(err));
}

function deleteSelectedRegimen() {
  const id = document.getElementById("regimenId").value;
  if (!id) {
    alert("No hay régimen seleccionado para eliminar.");
    return;
  }
  fetch(`${API_BASE}/regimens/${id}`, {
    method: "DELETE"
  })
  .then(() => {
    resetRegimenForm();
    fetchRegimens();
    renderRegimenOptions();
    document.getElementById("selectedRegimenId").value = "";
    document.getElementById("taskList").innerHTML = "";
  })
  .catch(err => console.error(err));
}

// ------------------------------------------------------------------
// TAREAS
// ------------------------------------------------------------------
function fetchTasks() {
  const regimenId = document.getElementById("selectedRegimenId").value;
  if (!regimenId) {
    alert("No hay régimen seleccionado");
    return;
  }
  fetch(`${API_BASE}/regimens/${regimenId}/tasks`)
    .then(res => res.json())
    .then(data => renderTasks(data))
    .catch(err => console.error(err));
}

function renderTasks(tasks) {
  const taskList = document.getElementById("taskList");
  taskList.innerHTML = "";
  if (!tasks.length) {
    taskList.innerHTML = "<p>No hay tareas</p>";
    return;
  }
  tasks.forEach(t => {
    const div = document.createElement("div");
    div.innerHTML = `
      <strong>ID: ${t.id}</strong> - [${t.task_type}] ${t.description}<br>
      Mag: ${t.magnitude}, Status: ${t.status}, Días: ${t.days}, Hora: ${t.time}
      <button onclick="editTaskForm(${t.id})">Editar</button>
      <button onclick="deleteTask(${t.id})">Eliminar</button>
      <hr>
    `;
    taskList.appendChild(div);
  });
}

function editTaskForm(taskId) {
  fetch(`${API_BASE}/tasks/${taskId}`)
    .then(res => res.json())
    .then(task => {
      document.getElementById("taskId").value = task.id;
      document.getElementById("taskType").value = task.task_type;
      document.getElementById("taskDescription").value = task.description;
      document.getElementById("taskMagnitude").value = task.magnitude;
      document.getElementById("taskStatus").value = task.status;
      document.getElementById("taskDays").value = task.days;
      document.getElementById("taskTime").value = task.time;
    })
    .catch(err => console.error(err));
}

function saveTask() {
  const regimenId = document.getElementById("selectedRegimenId").value;
  if (!regimenId) {
    alert("No hay régimen seleccionado");
    return;
  }
  const taskId = document.getElementById("taskId").value || null;
  const task_type = document.getElementById("taskType").value;
  const description = document.getElementById("taskDescription").value;
  const magnitude = parseFloat(document.getElementById("taskMagnitude").value) || 0.0;
  const status = document.getElementById("taskStatus").value;
  const days = parseInt(document.getElementById("taskDays").value, 10) || 0;
  const time = document.getElementById("taskTime").value;

  const payload = { task_type, description, magnitude, status, days, time };

  if (taskId) {
    // Update
    fetch(`${API_BASE}/tasks/${taskId}`, {
      method: "PUT",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(payload)
    })
    .then(() => {
      resetTaskForm();
      fetchTasks();
    })
    .catch(err => console.error(err));
  } else {
    // Create
    fetch(`${API_BASE}/regimens/${regimenId}/tasks`, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(payload)
    })
    .then(() => {
      resetTaskForm();
      fetchTasks();
    })
    .catch(err => console.error(err));
  }
}

function resetTaskForm() {
  document.getElementById("taskId").value = "";
  document.getElementById("taskType").value = "riego";
  document.getElementById("taskDescription").value = "";
  document.getElementById("taskMagnitude").value = "";
  document.getElementById("taskStatus").value = "pendiente";
  document.getElementById("taskDays").value = 0;
  document.getElementById("taskTime").value = "00:00";
}

function deleteTask(taskId) {
  fetch(`${API_BASE}/tasks/${taskId}`, { method: 'DELETE' })
    .then(() => fetchTasks())
    .catch(err => console.error(err));
}

// ------------------------------------------------------------------
// ARDUINO
// ------------------------------------------------------------------
/**
 * Obtiene el estado del Arduino desde /estado y actualiza los valores
 */
function fetchArduinoState() {
  fetch(`${API_BASE}/estado`)
    .then(res => res.json())
    .then(data => {
      if (!data.estado) {
        // Puede que venga algo como {"mensaje":"No se han recibido datos del robot"}
        // Si es así, mostramos algo breve
        console.warn("Estado Arduino no disponible:", data);
        return;
      }
      const estado = data.estado;

      // Actualizamos cada valor al lado de los inputs
      document.getElementById("arduinoServo1Val").textContent = estado.servoPos1 ?? "--";
      document.getElementById("arduinoServo2Val").textContent = estado.servoPos2 ?? "--";
      document.getElementById("arduinoFlowVal").textContent   = estado.flowRate ?? "--";
      document.getElementById("arduinoKpVal").textContent     = estado.Kp ?? "--";
      document.getElementById("arduinoKiVal").textContent     = estado.Ki ?? "--";
      document.getElementById("arduinoKdVal").textContent     = estado.Kd ?? "--";
      document.getElementById("arduinoCalVal").textContent    = estado.calFactor ?? "--";
    })
    .catch(err => console.error("Error al obtener estado del Arduino:", err));
}

/**
 * Envía un campo individual al endpoint /controlar
 * @param {string} field - Nombre del campo (servo1, servo2, flowRate, kp, ki, kd, cal)
 */
function sendArduinoField(field) {
  const payload = {};

  switch(field) {
    case 'servo1':
      payload.servo1 = parseInt(document.getElementById("arduinoServo1").value, 10) || 0;
      break;
    case 'servo2':
      payload.servo2 = parseInt(document.getElementById("arduinoServo2").value, 10) || 0;
      break;
    case 'flowRate':
      payload.flowRate = parseFloat(document.getElementById("arduinoFlowRate").value) || 0.0;
      break;
    case 'kp':
      payload.kp = parseFloat(document.getElementById("arduinoKp").value) || 0.0;
      break;
    case 'ki':
      payload.ki = parseFloat(document.getElementById("arduinoKi").value) || 0.0;
      break;
    case 'kd':
      payload.kd = parseFloat(document.getElementById("arduinoKd").value) || 0.0;
      break;
    case 'cal':
      payload.cal = parseFloat(document.getElementById("arduinoCal").value) || 1.0;
      break;
    default:
      alert("Campo no reconocido: " + field);
      return;
  }

  fetch(`${API_BASE}/controlar`, {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify(payload)
  })
  .then(res => {
    if (!res.ok) throw new Error("Error al enviar el comando");
    return res.json();
  })
  .then(() => {
    // Luego de enviar, refrescamos estado para ver que llegó
    fetchArduinoState();
  })
  .catch(err => console.error(err));
}
</script>
</body>
</html>
